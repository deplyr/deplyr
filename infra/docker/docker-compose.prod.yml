# Self-hosted control plane stack — this is what you run on the EC2 box (or
# any VPS) that hosts Deplyr itself. Not to be confused with the *managed*
# servers Deplyr deploys user apps to. Bring up with:
#
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env up -d
#
# then open the box's public IP (or domain) on port 80. See the root README
# for the full setup walkthrough and the required .env values.
#
# caddy is the one thing bound to the host's 80/443/4000 — it fronts both
# web and api, which aren't reachable from outside this Docker network any
# other way. Set DEPLYR_PUBLIC_HOST to a real domain and it gets you
# automatic HTTPS (Let's Encrypt) for free, same Caddyfile, no extra steps;
# set it to a bare IP (no domain yet) and DEPLYR_SITE_ADDRESS becomes
# http://<ip>, which serves plain HTTP — Caddy would otherwise self-sign an
# IP and redirect to it. Either way this file doesn't change.
#
# This box is also registered as your first managed server (no SSH — see
# apps/api/src/lib/local-server.ts). Apps deployed to it aren't behind a
# separate nginx: caddy stays the one front door on 80/443 and routes each app
# by hostname to its port on the host (packages/db/src/caddy.ts builds that
# config from the database; the api and worker push it whenever it changes).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deplyr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: deplyr
    volumes:
      - deplyr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deplyr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - deplyr_redis_data:/data

  # Not published directly — caddy is the only thing reachable from outside
  # this Docker network (see the file header), and proxies :4000 to it.
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://deplyr:${POSTGRES_PASSWORD}@postgres:5432/deplyr
      REDIS_URL: redis://redis:6379
      DEPLYR_MASTER_KEY: ${DEPLYR_MASTER_KEY}
      DEPLYR_SESSION_SECRET: ${DEPLYR_SESSION_SECRET}
      # Unset (blank) by default — leaves the self-host "create the admin
      # account" first-run wizard in place. Set to "true" in your .env for
      # an instance meant to have real, independent sign-ups (Cloud).
      DEPLYR_CLOUD_MODE: ${DEPLYR_CLOUD_MODE:-}
      PORT: 4000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_OAUTH_REDIRECT_URI: ${DEPLYR_PUBLIC_URL}:4000/auth/github/callback
      WEB_URL: ${DEPLYR_PUBLIC_URL}
      DEPLYR_APP_DOMAIN: ${DEPLYR_APP_DOMAIN}
      # This instance's own bare address, and where Caddy's admin API lives
      # — both needed for Settings' "point a domain at this instance" to
      # push Caddy a new config live (see routes/instance.ts). Internal to
      # this Docker network; never published to the host.
      DEPLYR_PUBLIC_HOST: ${DEPLYR_PUBLIC_HOST}
      CADDY_ADMIN_URL: http://caddy:2019
      # Lets the api register the box it runs on as a managed server, with no
      # SSH — the installer starts that server's agent with these same values
      # (see lib/local-server.ts). Blank on an .env from before this existed.
      DEPLYR_LOCAL_SERVER_ID: ${DEPLYR_LOCAL_SERVER_ID:-}
      DEPLYR_LOCAL_AGENT_TOKEN: ${DEPLYR_LOCAL_AGENT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # api's own CMD runs migrations before it starts serving (see
    # api.Dockerfile) — this only reports healthy once that's done, which
    # is what worker and web below actually wait on: querying a schema
    # that isn't there yet otherwise (a real gap, hit standing this up).
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://deplyr:${POSTGRES_PASSWORD}@postgres:5432/deplyr
      REDIS_URL: redis://redis:6379
      DEPLYR_MASTER_KEY: ${DEPLYR_MASTER_KEY}
      # Public — this is what a *managed* server's agent dials back to,
      # from outside this box entirely.
      DEPLYR_CONTROL_PLANE_WS: ws://${DEPLYR_PUBLIC_HOST}:4000/agent/ws
      DEPLYR_APP_DOMAIN: ${DEPLYR_APP_DOMAIN}
      # What the worker needs to route an app it just deployed on this box:
      # rebuild Caddy's config (packages/db/src/caddy.ts) and push it.
      DEPLYR_PUBLIC_HOST: ${DEPLYR_PUBLIC_HOST}
      CADDY_ADMIN_URL: http://caddy:2019
      DEPLYR_LOCAL_SERVER_ID: ${DEPLYR_LOCAL_SERVER_ID:-}
      # Adds "Open in Deplyr" links to Slack/Discord notifications.
      WEB_URL: ${DEPLYR_PUBLIC_URL}
      # Optional — see docs/architecture.md Deployed apps
      # are HTTP-only until you set these to a real wildcard cert/key.
      DEPLYR_WILDCARD_CERT_PEM: ${DEPLYR_WILDCARD_CERT_PEM:-}
      DEPLYR_WILDCARD_KEY_PEM: ${DEPLYR_WILDCARD_KEY_PEM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      # NEXT_PUBLIC_* only take effect as build args — Next.js inlines them
      # into the client bundle here, at build time. Setting them under
      # `environment:` below would silently do nothing (the browser would
      # keep calling whatever was baked in, or the code's own
      # http://localhost:4000 fallback if these were ever left out) — see
      # web.Dockerfile. Re-run `up -d --build` after changing either one;
      # a plain restart reuses the old image, same bundle, same values.
      args:
        # Same-origin path, not a host:port — a domain added later from Settings
        # would otherwise be blocked as mixed content (https page → http API).
        # Caddy routes /api/* to the api container (see the Caddyfile).
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_APP_DOMAIN: ${DEPLYR_APP_DOMAIN}
    restart: unless-stopped
    environment:
      # Server-side (Server Components, middleware): stays on the internal
      # Docker network, never leaves the box. Read at runtime, same as any
      # non-NEXT_PUBLIC_ variable — no build-time trick needed for this one.
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy

  # Front door — see the file header. Automatic HTTPS for a real
  # DEPLYR_PUBLIC_HOST, plain HTTP for a bare-IP one; either way, this is
  # the only service published to the host.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # --resume: if a newer config was pushed live via the admin API (see
    # routes/instance.ts — Settings' "point a domain at this instance"),
    # reload *that* on restart instead of always resetting to this static
    # Caddyfile. It's still what a fresh instance boots from the very first
    # time, before anything's ever been pushed.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--resume"]
    environment:
      # http://<ip> for a bare IP, plain hostname for a domain — see Caddyfile.
      # Falls back to the bare host for an .env from before this existed.
      DEPLYR_SITE_ADDRESS: ${DEPLYR_SITE_ADDRESS:-${DEPLYR_PUBLIC_HOST}}
    # Apps on this box run with host networking; Caddy reaches them at
    # host.docker.internal:<port> (see packages/db/src/caddy.ts).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - deplyr_caddy_data:/data
      - deplyr_caddy_config:/config
    ports:
      # 80 doubles as the ACME HTTP-01 challenge port for automatic HTTPS —
      # needed even when you're only ever visiting over :443. Override with
      # DEPLYR_WEB_PORT if this box also self-hosts apps (see the note up
      # top); doing that forfeits automatic HTTPS, per that same note.
      - "${DEPLYR_WEB_PORT:-80}:80"
      - "443:443"
      - "4000:4000"
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  deplyr_postgres_data:
  deplyr_redis_data:
  deplyr_caddy_data:
  deplyr_caddy_config:
