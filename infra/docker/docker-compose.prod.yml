# Self-hosted control plane stack — this is what you run on the EC2 box (or
# any VPS) that hosts Deplyr itself. Not to be confused with the *managed*
# servers Deplyr deploys user apps to. Bring up with:
#
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env up -d
#
# then open the box's public IP on port 80. See the root README for the
# full setup walkthrough and the required .env values.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deplyr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: deplyr
    volumes:
      - deplyr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deplyr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - deplyr_redis_data:/data

  # Published on its own port: the browser talks to it directly (cookies
  # aren't port-scoped, so this works fine alongside web on :80 — see
  # docs/PHASE1_DESIGN.md), and agents on remote managed servers need to
  # reach it too, from outside this Docker network entirely.
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://deplyr:${POSTGRES_PASSWORD}@postgres:5432/deplyr
      REDIS_URL: redis://redis:6379
      DEPLYR_MASTER_KEY: ${DEPLYR_MASTER_KEY}
      DEPLYR_SESSION_SECRET: ${DEPLYR_SESSION_SECRET}
      PORT: 4000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_OAUTH_REDIRECT_URI: ${DEPLYR_PUBLIC_URL}:4000/auth/github/callback
      WEB_URL: ${DEPLYR_PUBLIC_URL}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://deplyr:${POSTGRES_PASSWORD}@postgres:5432/deplyr
      REDIS_URL: redis://redis:6379
      DEPLYR_MASTER_KEY: ${DEPLYR_MASTER_KEY}
      # Public — this is what a *managed* server's agent dials back to,
      # from outside this box entirely.
      DEPLYR_CONTROL_PLANE_WS: ws://${DEPLYR_PUBLIC_HOST}:4000/agent/ws
      DEPLYR_APP_DOMAIN: ${DEPLYR_APP_DOMAIN}
      # Adds "Open in Deplyr" links to Slack/Discord notifications.
      WEB_URL: ${DEPLYR_PUBLIC_URL}
      # Optional — see docs/PHASE1_DESIGN.md section 5.3. Deployed apps
      # are HTTP-only until you set these to a real wildcard cert/key.
      DEPLYR_WILDCARD_CERT_PEM: ${DEPLYR_WILDCARD_CERT_PEM:-}
      DEPLYR_WILDCARD_KEY_PEM: ${DEPLYR_WILDCARD_KEY_PEM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      # Server-side (Server Components, middleware): stays on the internal
      # Docker network, never leaves the box.
      API_URL: http://api:4000
      # Browser-facing: must be the same public host the browser itself
      # uses to reach this box.
      NEXT_PUBLIC_API_URL: ${DEPLYR_PUBLIC_URL}:4000
      NEXT_PUBLIC_APP_DOMAIN: ${DEPLYR_APP_DOMAIN}
    ports:
      - "80:3000"
    depends_on:
      - api

volumes:
  deplyr_postgres_data:
  deplyr_redis_data:
